const KEY = "amarOvertime_v2";

let data = JSON.parse(localStorage.getItem(KEY) || "null");

if (!data) {
    data = {
        activeWorkerId: 1,
        workers: [
            {
                id: 1,
                name: "আমার হিসাব",
                settings: {}
            }
        ],
        records: {
            1: []
        }
    };
}

if (!Array.isArray(data.workers) || data.workers.length === 0) {
    data.workers = [
        {
            id: 1,
            name: "আমার হিসাব",
            settings: {}
        }
    ];

    data.activeWorkerId = 1;
}

if (!data.records || typeof data.records !== "object") {
    data.records = {};
}

const $ = (id) => document.getElementById(id);

function activeWorker() {
    return (
        data.workers.find(
            (w) => w.id === data.activeWorkerId
        ) || data.workers[0]
    );
}

function workerRecords() {
    const worker = activeWorker();

    if (!data.records[worker.id]) {
        data.records[worker.id] = [];
    }

    return data.records[worker.id];
}

function save() {
    localStorage.setItem(KEY, JSON.stringify(data));
    renderAll();
}

function todayLocal() {
    const d = new Date();
    const offset = d.getTimezoneOffset();

    return new Date(
        d.getTime() - offset * 60000
    )
        .toISOString()
        .slice(0, 10);
}

function money(n) {
    return "৳" + (Number(n) || 0).toFixed(2);
}

function fmtHours(n) {
    return (Number(n) || 0).toFixed(2);
}


/* =========================================================
   SETTINGS
========================================================= */

function settings() {
    const worker = activeWorker();
    const s = worker.settings || {};

    return {
        salary: Number($("salary")?.value) || Number(s.salary) || 15000,

        salaryDays:
            Number($("salaryDays")?.value) ||
            Number(s.salaryDays) ||
            26,

        regularHours:
            Number($("regularHours")?.value) ||
            Number(s.regularHours) ||
            8,

        otMultiplier: 2,

        attendanceBonus:
            Number($("attendanceBonus")?.value) ||
            Number(s.attendanceBonus) ||
            625,

        lateLimit:
            Number($("lateLimit")?.value) ||
            Number(s.lateLimit) ||
            15,

        nightBill:
            Number($("nightBill")?.value) ||
            Number(s.nightBill) ||
            100
    };
}

function loadSettings() {
    const worker = activeWorker();
    const s = worker.settings || {};

    const fields = [
        "salary",
        "salaryDays",
        "regularHours",
        "otMultiplier",
        "attendanceBonus",
        "lateLimit",
        "nightBill"
    ];

    fields.forEach((key) => {
        if (s[key] !== undefined && $(key)) {
            $(key).value = s[key];
        }
    });

    if ($("salary") && !$("salary").value) {
        $("salary").value = "15000";
    }

    if ($("salaryDays") && !$("salaryDays").value) {
        $("salaryDays").value = "26";
    }

    if ($("regularHours") && !$("regularHours").value) {
        $("regularHours").value = "8";
    }

    if ($("attendanceBonus") && !$("attendanceBonus").value) {
        $("attendanceBonus").value = "625";
    }

    if ($("lateLimit") && !$("lateLimit").value) {
        $("lateLimit").value = "15";
    }

    if ($("nightBill") && !$("nightBill").value) {
        $("nightBill").value = "100";
    }
}

function persistSettings() {
    const worker = activeWorker();

    worker.settings = settings();

    localStorage.setItem(KEY, JSON.stringify(data));

    renderAll();
}


/* =========================================================
   TIME FUNCTIONS
========================================================= */

function minutes(time) {
    if (!time || !time.includes(":")) {
        return 0;
    }

    const parts = time.split(":").map(Number);

    return parts[0] * 60 + parts[1];
}


/*
 * Calculates elapsed time between two clock times.
 *
 * Example:
 * 20:00 -> 04:00 = 8 hours
 * 08:00 -> 00:06 = 16 hours 6 minutes
 */
function duration(inTime, outTime) {
    let start = minutes(inTime);
    let end = minutes(outTime);

    if (end <= start) {
        end += 1440;
    }

    return end - start;
}


/*
 * Converts a clock time to the same timeline as the duty start.
 *
 * Example:
 * start = 20:00
 * out   = 04:00
 *
 * out becomes 1680 minutes instead of 240.
 */
function elapsedTime(inTime, clockTime) {
    let start = minutes(inTime);
    let point = minutes(clockTime);

    if (point < start) {
        point += 1440;
    }

    return point;
}


/*
 * Calculates overlap with 13:00 - 14:00 lunch.
 *
 * This is mainly used for Holiday Day Duty.
 */
function lunchOverlap(inTime, outTime) {
    let start = minutes(inTime);
    let end = minutes(outTime);

    if (end <= start) {
        end += 1440;
    }

    let lunchStart = 13 * 60;
    let lunchEnd = 14 * 60;

    /*
     * If the duty starts after midnight and the lunch
     * period belongs to the next timeline, adjust it.
     */
    if (lunchStart < start) {
        lunchStart += 1440;
        lunchEnd += 1440;
    }

    const overlapStart = Math.max(start, lunchStart);
    const overlapEnd = Math.min(end, lunchEnd);

    return Math.max(0, overlapEnd - overlapStart);
}


/* =========================================================
   MAIN CALCULATION
========================================================= */

function calculate(r) {
    const s = settings();

    let regular = 0;
    let ot = 0;
    let late = 0;
    let early = false;
    let night = 0;

    /*
     * Leave / Sick / Absent
     */
    if (
        ["leave", "sick", "absent"].includes(
            r.status
        )
    ) {
        return {
            regular,
            ot,
            late,
            early,
            night
        };
    }

    if (!r.inTime || !r.outTime) {
        return {
            regular,
            ot,
            late,
            early,
            night
        };
    }

    const totalMinutes = duration(
        r.inTime,
        r.outTime
    );

    const totalHours = totalMinutes / 60;

    const inM = minutes(r.inTime);
    const outM = minutes(r.outTime);

    /*
     * =====================================================
     * HOLIDAY DUTY
     * =====================================================
     *
     * Holiday duty can be Day or Night.
     *
     * All worked time is OT.
     *
     * Holiday Day Duty:
     * 13:00 - 14:00 lunch = 1 hour deduction.
     *
     * Holiday Night Duty:
     * No lunch deduction.
     *
     * No late is counted on holidays.
     */

    if (r.dutyType === "holiday") {
        let holidayOtMinutes = totalMinutes;

        /*
         * Day holiday duty gets 13:00-14:00 lunch deduction.
         */
        if (
            r.holidayShift === "day" ||
            r.shift === "day"
        ) {
            const lunchMinutes = lunchOverlap(
                r.inTime,
                r.outTime
            );

            holidayOtMinutes =
                Math.max(
                    0,
                    totalMinutes - lunchMinutes
                );
        }

        /*
         * If no holidayShift/shift is stored,
         * determine by start time.
         *
         * Before 18:00 = Day
         * 18:00 or later = Night
         */
        if (
            r.holidayShift !== "day" &&
            r.holidayShift !== "night" &&
            r.shift !== "day" &&
            r.shift !== "night"
        ) {
            if (inM < 18 * 60) {
                const lunchMinutes = lunchOverlap(
                    r.inTime,
                    r.outTime
                );

                holidayOtMinutes =
                    Math.max(
                        0,
                        totalMinutes - lunchMinutes
                    );
            }
        }

        ot = holidayOtMinutes / 60;

        /*
         * Holiday has NO late.
         */
        late = 0;

        /*
         * If holiday duty crosses midnight,
         * add Night Bill.
         */
        if (outM <= inM) {
            night = s.nightBill;
        }

        return {
            regular: 0,
            ot,
            late: 0,
            early: false,
            night
        };
    }


    /*
     * =====================================================
     * NIGHT DUTY
     * =====================================================
     *
     * Normal Night:
     * 20:00 -> 04:00 = 8 hours regular
     * After 04:00 = OT
     *
     * Midnight crossing is automatically handled.
     */

    if (r.dutyType === "night") {

        regular = Math.min(
            s.regularHours,
            totalHours
        );

        ot = Math.max(
            0,
            totalHours - s.regularHours
        );

        /*
         * Night Bill:
         * Any night duty crossing midnight
         * receives ৳100.
         */
        if (outM <= inM) {
            night = s.nightBill;
        }

        return {
            regular,
            ot,
            late: 0,
            early: false,
            night
        };
    }


    /*
     * =====================================================
     * NORMAL DAY DUTY
     * =====================================================
     *
     * Normal Day:
     * 08:00 -> 17:00
     *
     * 17:00 onward = OT.
     *
     * Important:
     * If outTime is 00:06, 01:00 etc.,
     * it belongs to the following day.
     */

    if (r.dutyType === "day") {

        /*
         * Late:
         * Day duty expected at 08:00.
         *
         * Holiday already returned above,
         * therefore holiday has no late.
         */
        if (inM > 8 * 60) {
            late = inM - 8 * 60;
        }

        /*
         * Convert out time to elapsed timeline.
         */
        let start = inM;
        let end = outM;

        if (end <= start) {
            end += 1440;
        }

        /*
         * Normal Day OT starts at 17:00.
         */
        let regularEnd = 17 * 60;

        /*
         * If duty started after midnight,
         * keep 17:00 on the correct timeline.
         */
        if (regularEnd < start) {
            regularEnd += 1440;
        }

        /*
         * Regular time is up to 17:00.
         */
        const regularMinutes =
            Math.max(
                0,
                Math.min(
                    end,
                    regularEnd
                ) - start
            );

        regular =
            Math.min(
                s.regularHours,
                regularMinutes / 60
            );

        /*
         * Everything after 17:00 is OT.
         */
        const otMinutes =
            Math.max(
                0,
                end - regularEnd
            );

        ot = otMinutes / 60;

        /*
         * If the person leaves before normal
         * duty completion, mark early.
         *
         * This is used for attendance bonus logic.
         */
        if (end < regularEnd) {
            early = true;
        }

        /*
         * Day duty crossing midnight also gets
         * Night Bill.
         */
        if (outM <= inM) {
            night = s.nightBill;
        }

        return {
            regular,
            ot,
            late,
            early,
            night
        };
    }


    /*
     * Fallback
     */

    return {
        regular,
        ot,
        late,
        early,
        night
    };
}


/* =========================================================
   MONTHLY STATISTICS
========================================================= */

function monthStats() {
    const s = settings();

    const ym = todayLocal().slice(0, 7);

    const rs = workerRecords().filter(
        (r) =>
            r.date &&
            r.date.startsWith(ym)
    );

    let present = 0;
    let absent = 0;
    let leave = 0;
    let holiday = 0;

    let regular = 0;
    let ot = 0;
    let late = 0;
    let night = 0;

    let early = false;

    rs.forEach((r) => {

        const c = calculate(r);

        if (r.status === "present") {
            present++;
        } else if (r.status === "absent") {
            absent++;
        } else if (
            ["leave", "sick"].includes(
                r.status
            )
        ) {
            leave++;
        } else if (
            r.status === "holiday"
        ) {
            holiday++;
        }

        regular += c.regular;
        ot += c.ot;

        /*
         * Holiday late is already 0
         * from calculate().
         */
        late += c.late;

        night += c.night;

        if (c.early) {
            early = true;
        }
    });


    /*
     * Hourly wage calculation.
     */
    const hourly =
        s.salary /
        (s.salaryDays * s.regularHours);

    /*
     * OT rate = hourly × 2
     */
    const otRate =
        hourly * s.otMultiplier;

    const otPay =
        ot * otRate;


    /*
     * Attendance Bonus
     *
     * Total monthly late:
     *
     * <= 15 minutes = ৳625 bonus
     * > 15 minutes = bonus lost
     *
     * Holiday has no late.
     */
    const bonus =
        late > s.lateLimit || early
            ? 0
            : s.attendanceBonus;


    const total =
        s.salary +
        otPay +
        bonus +
        night;


    return {
        rs,
        present,
        absent,
        leave,
        holiday,
        regular,
        ot,
        late,
        night,
        hourly,
        otRate,
        otPay,
        bonus,
        total,
        early
    };
}


/* =========================================================
   DASHBOARD
========================================================= */

function stat(
    title,
    value,
    cls = "",
    primary = false
) {
    return `
        <div class="stat ${primary ? "primary" : ""}">
            <small>${title}</small>
            <strong class="${cls}">
                ${value}
            </strong>
        </div>
    `;
}

function renderDashboard() {

    const m = monthStats();
    const s = settings();
    const w = activeWorker();

    if ($("activeWorkerName")) {
        $("activeWorkerName").textContent =
            w.name;
    }

    if ($("activeWorkerMeta")) {
        $("activeWorkerMeta").textContent =
            `${todayLocal().slice(0, 7)} • মাসিক হিসাব`;
    }

    if (!$("dashboard")) {
        return;
    }

    $("dashboard").innerHTML = [

        stat(
            "এই মাসের মোট বেতন",
            money(m.total),
            "",
            true
        ),

        stat(
            "Present",
            m.present
        ),

        stat(
            "Regular Hours",
            fmtHours(m.regular)
        ),

        stat(
            "OT Hours",
            fmtHours(m.ot)
        ),

        stat(
            "OT Rate",
            money(m.otRate)
        ),

        stat(
            "OT Wage",
            money(m.otPay)
        ),

        stat(
            "Late",
            m.late + " min",
            m.late > s.lateLimit
                ? "bad"
                : ""
        ),

        stat(
            "Night Bill",
            money(m.night)
        ),

        stat(
            "Attendance Bonus",
            money(m.bonus),
            m.bonus
                ? "ok"
                : "bad"
        )

    ].join("");
}


/* =========================================================
   TODAY
========================================================= */

function renderToday() {

    if (!$("todayCard")) {
        return;
    }

    const r =
        workerRecords().find(
            (x) =>
                x.date === todayLocal()
        );

    if (!r) {

        $("todayCard").innerHTML =
            `
            <div class="empty">
                আজকের কোনো ডিউটি সেভ করা হয়নি।
            </div>
            `;

        return;
    }

    const c = calculate(r);

    const dutyName =
        r.dutyType === "night"
            ? "Night Duty"
            : r.dutyType === "holiday"
                ? "Holiday Duty"
                : "Day Duty";

    $("todayCard").innerHTML =
        `
        <div class="today-row">

            <div>
                <strong>
                    ${dutyName}
                </strong>

                <br>

                <span class="badge ${r.status}">
                    ${r.status}
                </span>
            </div>

            <div>
                <b>
                    OT ${fmtHours(c.ot)} h
                </b>

                <br>

                <small>
                    ${r.inTime || "-"}
                    →
                    ${r.outTime || "-"}
                </small>
            </div>

        </div>
        `;
}


/* =========================================================
   RECENT RECORDS
========================================================= */

function renderRecent() {

    if (!$("recentRecords")) {
        return;
    }

    const rs =
        workerRecords()
            .slice()
            .sort(
                (a, b) =>
                    b.date.localeCompare(
                        a.date
                    )
            )
            .slice(0, 5);

    if (!rs.length) {

        $("recentRecords").innerHTML =
            `
            <div class="empty">
                এখনও কোনো রেকর্ড নেই।
            </div>
            `;

        return;
    }

    $("recentRecords").innerHTML =
        rs
            .map((r) => {

                const c =
                    calculate(r);

                const dutyName =
                    r.dutyType === "night"
                        ? "Night"
                        : r.dutyType === "holiday"
                            ? "Holiday"
                            : "Day";

                return `
                    <div
                        class="record-row"
                        style="
                            padding:10px 0;
                            border-bottom:1px solid #e2e8f0
                        "
                    >

                        <div>
                            <b>${r.date}</b>

                            <br>

                            <small>
                                ${dutyName}
                                •
                                ${r.status}
                            </small>
                        </div>

                        <div>
                            <b>
                                OT ${fmtHours(c.ot)}h
                            </b>

                            <br>

                            <small>
                                ${money(c.night)}
                            </small>
                        </div>

                    </div>
                `;
            })
            .join("");
}


/* =========================================================
   RECORDS TABLE
========================================================= */

function renderRecords() {

    if (!$("records")) {
        return;
    }

    const q =
        ($("recordSearch")?.value || "")
            .toLowerCase();

    let rs =
        workerRecords()
            .slice()
            .sort(
                (a, b) =>
                    b.date.localeCompare(
                        a.date
                    )
            );

    if (q) {

        rs = rs.filter((r) => {

            const text =
                `${r.date} ${r.status} ${r.dutyType} ${r.notes || ""}`
                    .toLowerCase();

            return text.includes(q);
        });
    }

    if ($("recordCount")) {
        $("recordCount").textContent =
            `${rs.length}টি রেকর্ড`;
    }

    if (!rs.length) {

        $("records").innerHTML =
            `
            <tr>
                <td
                    colspan="10"
                    class="empty"
                >
                    কোনো রেকর্ড পাওয়া যায়নি।
                </td>
        
