const KEY = "amarOvertime_v2";

let data = JSON.parse(localStorage.getItem(KEY) || "null");

if (!data) {
    data = {
        activeWorkerId: 1,
        workers: [
            {
                id: 1,
                name: "আমার হিসাব",
                settings: {}
            }
        ],
        records: {
            1: []
        }
    };
}

if (!Array.isArray(data.workers) || data.workers.length === 0) {
    data.workers = [
        {
            id: 1,
            name: "আমার হিসাব",
            settings: {}
        }
    ];

    data.activeWorkerId = 1;
}

if (!data.records) {
    data.records = {};
}

const $ = (id) => document.getElementById(id);

function activeWorker() {
    return (
        data.workers.find(
            (worker) => worker.id === data.activeWorkerId
        ) || data.workers[0]
    );
}

function workerRecords() {
    const worker = activeWorker();

    if (!data.records[worker.id]) {
        data.records[worker.id] = [];
    }

    return data.records[worker.id];
}

function save() {
    localStorage.setItem(KEY, JSON.stringify(data));
    renderAll();
}

function todayLocal() {
    const d = new Date();
    const offset = d.getTimezoneOffset();

    return new Date(
        d.getTime() - offset * 60000
    )
        .toISOString()
        .slice(0, 10);
}

function money(value) {
    return "৳" + (Number(value) || 0).toFixed(2);
}

function fmtHours(value) {
    return (Number(value) || 0).toFixed(2);
}

/* =========================================================
   SETTINGS
========================================================= */

function settings() {
    const worker = activeWorker();
    const saved = worker.settings || {};

    return {
        salary: Number(
            $("salary")?.value || saved.salary || 0
        ),

        salaryDays: Number(
            $("salaryDays")?.value || saved.salaryDays || 26
        ),

        regularHours: Number(
            $("regularHours")?.value || saved.regularHours || 8
        ),

        otMultiplier: Number(
            $("otMultiplier")?.value || saved.otMultiplier || 2
        ),

        attendanceBonus: Number(
            $("attendanceBonus")?.value ||
            saved.attendanceBonus ||
            625
        ),

        lateLimit: Number(
            $("lateLimit")?.value ||
            saved.lateLimit ||
            15
        ),

        nightBill: Number(
            $("nightBill")?.value ||
            saved.nightBill ||
            100
        )
    };
}

function loadSettings() {
    const saved = activeWorker().settings || {};

    const fields = [
        "salary",
        "salaryDays",
        "regularHours",
        "otMultiplier",
        "attendanceBonus",
        "lateLimit",
        "nightBill"
    ];

    fields.forEach((key) => {
        if (saved[key] !== undefined && $(key)) {
            $(key).value = saved[key];
        }
    });

    if ($("salary") && !$("salary").value) {
        $("salary").value = "15000";
    }

    if ($("salaryDays") && !$("salaryDays").value) {
        $("salaryDays").value = "26";
    }

    if ($("regularHours") && !$("regularHours").value) {
        $("regularHours").value = "8";
    }

    if ($("otMultiplier") && !$("otMultiplier").value) {
        $("otMultiplier").value = "2";
    }

    if ($("attendanceBonus") && !$("attendanceBonus").value) {
        $("attendanceBonus").value = "625";
    }

    if ($("lateLimit") && !$("lateLimit").value) {
        $("lateLimit").value = "15";
    }

    if ($("nightBill") && !$("nightBill").value) {
        $("nightBill").value = "100";
    }
}

function persistSettings() {
    activeWorker().settings = settings();

    localStorage.setItem(
        KEY,
        JSON.stringify(data)
    );

    renderAll();
}

/* =========================================================
   TIME FUNCTIONS
========================================================= */

function minutes(time) {
    if (!time || !time.includes(":")) {
        return 0;
    }

    const parts = time.split(":").map(Number);

    const h = Number(parts[0]) || 0;
    const m = Number(parts[1]) || 0;

    return h * 60 + m;
}

/*
 * Calculates elapsed minutes.
 *
 * Example:
 * 20:00 -> 04:00 = 480 minutes
 * 08:00 -> 00:06 = 966 minutes
 */
function duration(inTime, outTime) {
    let start = minutes(inTime);
    let end = minutes(outTime);

    if (end <= start) {
        end += 1440;
    }

    return Math.max(0, end - start);
}

/*
 * Converts a clock time into the same elapsed-day timeline
 * starting from the employee's In Time.
 */
function elapsedTimeFromStart(
    inTime,
    clockTime
) {
    const start = minutes(inTime);
    let point = minutes(clockTime);

    if (point < start) {
        point += 1440;
    }

    return point;
}

/* =========================================================
   HOLIDAY LUNCH
   13:00 - 14:00
========================================================= */

function holidayLunchOverlap(
    inTime,
    outTime
) {
    let start = minutes(inTime);
    let end = minutes(outTime);

    if (end <= start) {
        end += 1440;
    }

    let lunchStart = 13 * 60;
    let lunchEnd = 14 * 60;

    /*
     * If the shift starts after midnight or otherwise
     * crosses a day boundary, align lunch with the
     * same timeline.
     */
    while (lunchStart < start) {
        lunchStart += 1440;
        lunchEnd += 1440;
    }

    const overlapStart = Math.max(
        start,
        lunchStart
    );

    const overlapEnd = Math.min(
        end,
        lunchEnd
    );

    return Math.max(
        0,
        overlapEnd - overlapStart
    );
}

/* =========================================================
   NIGHT CROSSING
========================================================= */

function crossesMidnight(
    inTime,
    outTime
) {
    if (!inTime || !outTime) {
        return false;
    }

    return minutes(outTime) <= minutes(inTime);
}

/* =========================================================
   MAIN CALCULATION
========================================================= */

function calculate(record) {
    const s = settings();

    let regular = 0;
    let ot = 0;
    let late = 0;
    let early = false;
    let night = 0;

    /*
     * Leave / Sick / Absent:
     * no working hours and no OT.
     */
    if (
        ["leave", "sick", "absent"].includes(
            record.status
        )
    ) {
        return {
            regular,
            ot,
            late,
            early,
            night
        };
    }

    if (!record.inTime || !record.outTime) {
        return {
            regular,
            ot,
            late,
            early,
            night
        };
    }

    const totalMinutes = duration(
        record.inTime,
        record.outTime
    );

    const totalHours =
        totalMinutes / 60;

    const inMinutes =
        minutes(record.inTime);

    const outMinutes =
        minutes(record.outTime);

    /*
     * =====================================================
     * HOLIDAY DUTY
     *
     * Holiday Day/Night:
     * all worked time = OT
     *
     * 13:00 - 14:00 lunch is deducted.
     *
     * Holiday has NO late.
     * =====================================================
     */
    if (
        record.dutyType === "holiday" ||
        record.status === "holiday"
    ) {
        const lunchMinutes =
            holidayLunchOverlap(
                record.inTime,
                record.outTime
            );

        ot = Math.max(
            0,
            totalMinutes - lunchMinutes
        ) / 60;

        regular = 0;

        /*
         * Holiday duty crossing midnight
         * receives Night Bill.
         */
        if (
            crossesMidnight(
                record.inTime,
                record.outTime
            )
        ) {
            night = s.nightBill;
        }

        /*
         * IMPORTANT:
         * No late on holidays.
         */
        late = 0;
        early = false;

        return {
            regular,
            ot,
            late,
            early,
            night
        };
    }

    /*
     * =====================================================
     * NIGHT DUTY
     *
     * Normal:
     * 20:00 -> 04:00 = 8 hours regular
     * 04:00 onward = OT
     * =====================================================
     */

    if (record.dutyType === "night") {
        regular = Math.min(
            s.regularHours,
            totalHours
        );

        ot = Math.max(
            0,
            totalHours - s.regularHours
        );

        /*
         * Night duty late:
         * scheduled In Time = 20:00
         */
        const scheduledNightIn = 20 * 60;

        if (inMinutes > scheduledNightIn) {
            late =
                inMinutes -
                scheduledNightIn;
        }

        /*
         * Night duty crossing midnight
         * gets Night Bill.
         */
        if (
            crossesMidnight(
                record.inTime,
                record.outTime
            )
        ) {
            night = s.nightBill;
        }

        return {
            regular,
            ot,
            late,
            early,
            night
        };
    }

    /*
     * =====================================================
     * DAY DUTY
     *
     * 08:00 -> 17:00
     * 17:00 onward = OT
     *
     * IMPORTANT:
     * If Out Time is 00:06, 01:00, 01:30 etc.,
     * it is treated as the NEXT DAY.
     * =====================================================
     */

    const dayStart = 8 * 60;
    const dayEnd = 17 * 60;

    /*
     * Late is calculated from 08:00.
     */
    if (inMinutes > dayStart) {
        late =
            inMinutes -
            dayStart;
    }

    /*
     * Convert Out Time into elapsed timeline.
     *
     * Example:
     * In 08:00
     * Out 00:06
     *
     * Out becomes 1446 minutes.
     */
    let elapsedOut =
        minutes(record.outTime);

    if (elapsedOut <= inMinutes) {
        elapsedOut += 1440;
    }

    /*
     * 17:00 cutoff on the same shift timeline.
     */
    let cutoff = dayEnd;

    if (cutoff <= inMinutes) {
        cutoff += 1440;
    }

    /*
     * OT starts exactly after 17:00.
     */
    if (elapsedOut > cutoff) {
        ot =
            (elapsedOut - cutoff) /
            60;
    } else {
        ot = 0;
    }

    /*
     * Regular working time is maximum 8 hours.
     *
     * 08:00 -> 17:00 contains 9 elapsed hours,
     * including the 1 hour lunch.
     */
    const regularElapsedMinutes =
        Math.min(
            Math.max(
                0,
                cutoff - inMinutes
            ),
            9 * 60
        );

    /*
     * Convert 9 elapsed hours into
     * 8 actual regular working hours.
     */
    regular =
        Math.min(
            s.regularHours,
            Math.max(
                0,
                regularElapsedMinutes / 60 - 1
            )
        );

    /*
     * If the employee leaves before 17:00,
     * this is considered early departure.
     */
    if (elapsedOut < cutoff) {
        early = true;
    }

    /*
     * Day duty crossing midnight:
     * Night Bill = ৳100.
     */
    if (
        crossesMidnight(
            record.inTime,
            record.outTime
        )
    ) {
        night = s.nightBill;
    }

    return {
        regular,
        ot,
        late,
        early,
        night
    };
}

/* =========================================================
   MONTHLY STATISTICS
========================================================= */

function monthStats() {
    const s = settings();

    const currentMonth =
        todayLocal().slice(0, 7);

    const records =
        workerRecords().filter(
            (record) =>
                record.date &&
                record.date.startsWith(
                    currentMonth
                )
        );

    let present = 0;
    let absent = 0;
    let leave = 0;
    let holiday = 0;

    let regular = 0;
    let ot = 0;
    let late = 0;
    let night = 0;

    let early = false;

    records.forEach((record) => {
        const calculation =
            calculate(record);

        if (record.status === "present") {
            present++;
        }

        if (record.status === "absent") {
            absent++;
        }

        if (
            ["leave", "sick"].includes(
                record.status
            )
        ) {
            leave++;
        }

        if (
            record.status === "holiday" ||
            record.dutyType === "holiday"
        ) {
            holiday++;
        }

        regular += calculation.regular;
        ot += calculation.ot;
        late += calculation.late;
        night += calculation.night;

        if (calculation.early) {
            early = true;
        }
    });

    /*
     * Existing salary calculation retained.
     */
    const hourly =
        s.salary > 0 &&
        s.salaryDays > 0 &&
        s.regularHours > 0
            ? (s.salary * 0.5605) /
              (s.salaryDays * s.regularHours)
            : 0;

    const otRate =
        hourly * s.otMultiplier;

    const otPay =
        ot * otRate;

    /*
     * Attendance bonus:
     *
     * Holiday late = never counted.
     *
     * Total late > 15 minutes
     * => bonus lost.
     *
     * Total late <= 15 minutes
     * => bonus retained.
     */
    const bonus =
        late > s.lateLimit || early
            ? 0
            : s.attendanceBonus;

    const total =
        s.salary +
        otPay +
        bonus +
        night;

    return {
        records,
        rs: records,

        present,
        absent,
        leave,
        holiday,

        regular,
        ot,
        late,
        night,

        hourly,
        otRate,
        otPay,

        bonus,
        total,

        early
    };
}

/* =========================================================
   DASHBOARD
========================================================= */

function stat(
    title,
    value,
    className = "",
    primary = false
) {
    return `
        <div class="stat ${
            primary ? "primary" : ""
        }">
            <small>${title}</small>
            <strong class="${className}">
                ${value}
            </strong>
        </div>
    `;
}

function renderDashboard() {
    const m = monthStats();
    const s = settings();
    const worker = activeWorker();

    if ($("activeWorkerName")) {
        $("activeWorkerName").textContent =
            worker.name;
    }

    if ($("activeWorkerMeta")) {
        $("activeWorkerMeta").textContent =
            `${todayLocal().slice(0, 7)} • মাসিক হিসাব`;
    }

    if (!$("dashboard")) {
        return;
    }

    $("dashboard").innerHTML = [
        stat(
            "এই মাসের মোট বেতন",
            money(m.total),
            "",
            true
        ),

        stat(
            "Present",
            m.present
        ),

        stat(
            "Regular Hours",
            fmtHours(m.regular)
        ),

        stat(
            "OT Hours",
            fmtHours(m.ot)
        ),

        stat(
            "OT Rate",
            money(m.otRate)
        ),

        stat(
            "OT Wage",
            money(m.otPay)
        ),

        stat(
            "Late",
            m.late + " min",
            m.late > s.lateLimit
                ? "bad"
                : ""
        ),

        stat(
            "Night Bill",
            money(m.night)
        ),

        stat(
            "Attendance Bonus",
            money(m.bonus),
            m.bonus
                ? "ok"
                : "bad"
        )
    ].join("");
}

/* =========================================================
   TODAY
========================================================= */

function renderToday() {
    if (!$("todayCard")) {
        return;
    }

    const record =
        workerRecords().find(
            (item) =>
                item.date === todayLocal()
        );

    if (!record) {
        $("todayCard").innerHTML =
            '<div class="empty">আজকের কোনো ডিউটি সেভ করা হয়নি।</div>';

        return;
    }

    const calculation =
        calculate(record);

    let dutyLabel = "Day Duty";

    if (record.dutyType === "night") {
        dutyLabel = "Night Duty";
    }

    if (
        record.dutyType === "holiday" ||
        record.status === "holiday"
    ) {
        dutyLabel = "Holiday Duty";
    }

    $("todayCard").innerHTML = `
        <div class="today-row">

            <div>
                <strong>
                    ${dutyLabel}
                </strong>

                <br>

                <span class="badge ${record.status}">
                    ${record.status}
                </span>
            </div>

            <div>
                <b>
                    OT ${fmtHours(
                        calculation.ot
                    )} h
                </b>

                <br>

                <small>
                    ${record.inTime || "-"}
                    →
                    ${record.outTime || "-"}
                </small>

                <br>

                <small>
                    Night Bill:
                    ${money(
                        calculation.night
                    )}
                </small>
            </div>

        </div>
    `;
}

/* =========================================================
   RECENT RECORDS
========================================================= */

function renderRecent() {
    if (!$("recentRecords")) {
        return;
    }

    const records =
        workerRecords()
            .slice()
            .sort(
                (a, b) =>
                    b.date.localeCompare(
                        a.date
                    )
            )
            .slice(0, 5);

    if (!records.length) {
        $("recentRecords").innerHTML =
            '<div class="empty">এখনও কোনো রেকর্ড নেই।</div>';

        return;
    }

    $("recentRecords").innerHTML =
        records
            .map((record) => {
                const c =
                    calculate(record);

                let duty = "Day";

                if (
                    record.dutyType ===
                    "night"
                ) {
                    duty = "Night";
                }

                if (
                    record.dutyType ===
                        "holiday" ||
                    record.status ===
                        "holiday"
                ) {
                    duty = "Holiday";
                }

                return `
                    <div
                        class="record-row"
                        style="
                            padding:10px 0;
                            border-bottom:1px solid #e2e8f0
                        "
                    >

                        <div>
                            <b>${record.date}</b>

                            <br>

                            <small>
                                ${duty}
                                •
                                ${record.status}
                            </small>
                        </div>

                        <div>
                            <b>
                                OT ${fmtHours(
                                    c.ot
                                )}h
                            </b>

                            <br>

                            <small>
                                ${money(c.night)}
                            </small>
                        </div>

                    </div>
                `;
            })
            .join("");
}

/* =========================================================
   ALL RECORDS
========================================================= */

function renderRecords() {
    if (
        !$("records") ||
        !$("recordSearch")
    ) {
        return;
    }

    
