const KEY = "amarOvertime_v2";
let data = JSON.parse(localStorage.getItem(KEY) || "null");

if (!data) {
  data = {
    activeWorkerId: 1,
    workers: [{ id: 1, name: "আমার হিসাব", settings: {} }],
    records: { 1: [] }
  };
}

if (!Array.isArray(data.workers) || data.workers.length === 0) {
  data.workers = [{ id: 1, name: "আমার হিসাব", settings: {} }];
  data.activeWorkerId = 1;
}
if (!data.records) {
  data.records = {};
}

const $ = (id) => document.getElementById(id);

function activeWorker() {
  return (
    data.workers.find((worker) => worker.id === data.activeWorkerId) ||
    data.workers[0]
  );
}

function workerRecords() {
  const worker = activeWorker();
  if (!data.records[worker.id]) {
    data.records[worker.id] = [];
  }
  return data.records[worker.id];
}

function save() {
  localStorage.setItem(KEY, JSON.stringify(data));
  renderAll();
}

function todayLocal() {
  const d = new Date();
  const offset = d.getTimezoneOffset();
  return new Date(d.getTime() - offset * 60000).toISOString().slice(0, 10);
}

function money(value) {
  return "৳" + (Number(value) || 0).toFixed(2);
}

function fmtHours(value) {
  return (Number(value) || 0).toFixed(2);
}

/* ========================================================= SETTINGS ========================================================= */
function settings() {
  const worker = activeWorker();
  const saved = worker.settings || {};
  return {
    salary: Number($("salary")?.value || saved.salary || 15000),
    salaryDays: Number($("salaryDays")?.value || saved.salaryDays || 26),
    regularHours: Number($("regularHours")?.value || saved.regularHours || 8),
    otMultiplier: Number($("otMultiplier")?.value || saved.otMultiplier || 2),
    attendanceBonus: Number($("attendanceBonus")?.value || saved.attendanceBonus || 625),
    lateLimit: Number($("lateLimit")?.value || saved.lateLimit || 15),
    nightBill: Number($("nightBill")?.value || saved.nightBill || 100)
  };
}

function loadSettings() {
  const saved = activeWorker().settings || {};
  const defaults = {
    salary: "15000",
    salaryDays: "26",
    regularHours: "8",
    otMultiplier: "2",
    attendanceBonus: "625",
    lateLimit: "15",
    nightBill: "100"
  };

  Object.keys(defaults).forEach((key) => {
    if ($(key)) {$(key).value = saved[key] !== undefined ? saved[key] : defaults[key];
    }
  });
}

function persistSettings() {
  activeWorker().settings = settings();
  localStorage.setItem(KEY, JSON.stringify(data));
  renderDashboard(); // Full renderAll()-এর বদলে শুধু ড্যাশবোর্ড আপডেট
}

/* ========================================================= TIME FUNCTIONS ========================================================= */
function minutes(time) {
  if (!time || !time.includes(":")) return 0;
  const parts = time.split(":").map(Number);
  return (parts[0] || 0) * 60 + (parts[1] || 0);
}

function duration(inTime, outTime) {
  let start = minutes(inTime);
  let end = minutes(outTime);
  if (end <= start) {
    end += 1440;
  }
  return Math.max(0, end - start);
}

function holidayLunchOverlap(inTime, outTime) {
  let start = minutes(inTime);
  let end = minutes(outTime);
  if (end <= start) end += 1440;

  let lunchStart = 13 * 60;
  let lunchEnd = 14 * 60;

  while (lunchStart < start) {
    lunchStart += 1440;
    lunchEnd += 1440;
  }

  const overlapStart = Math.max(start, lunchStart);
  const overlapEnd = Math.min(end, lunchEnd);
  return Math.max(0, overlapEnd - overlapStart);
}

function crossesMidnight(inTime, outTime) {
  if (!inTime || !outTime) return false;
  return minutes(outTime) <= minutes(inTime);
}

/* ========================================================= MAIN CALCULATION ========================================================= */
function calculate(record) {
  const s = settings();
  let regular = 0, ot = 0, late = 0, early = false, night = 0;

  if (["leave", "sick", "absent"].includes(record.status)) {
    return { regular, ot, late, early, night };
  }

  if (!record.inTime || !record.outTime) {
    return { regular, ot, late, early, night };
  }

  const totalMinutes = duration(record.inTime, record.outTime);
  const totalHours = totalMinutes / 60;
  const inMinutes = minutes(record.inTime);

  // 1. HOLIDAY DUTY
  if (record.dutyType === "holiday" || record.status === "holiday") {
    const lunchMinutes = holidayLunchOverlap(record.inTime, record.outTime);
    ot = Math.max(0, totalMinutes - lunchMinutes) / 60;
    regular = 0;
    late = 0;
    if (crossesMidnight(record.inTime, record.outTime)) {
      night = s.nightBill;
    }
    return { regular, ot, late, early, night };
  }

  // 2. NIGHT DUTY
  if (record.dutyType === "night") {
    regular = Math.min(s.regularHours, totalHours);
    ot = Math.max(0, totalHours - s.regularHours);
    const scheduledNightIn = 20 * 60; // 20:00
    if (inMinutes > scheduledNightIn) {
      late = inMinutes - scheduledNightIn;
    }
    if (crossesMidnight(record.inTime, record.outTime)) {
      night = s.nightBill;
    }
    return { regular, ot, late, early, night };
  }

  // 3. DAY DUTY
  const dayStart = 8 * 60;
  const dayEnd = 17 * 60;

  if (inMinutes > dayStart) {
    late = inMinutes - dayStart;
  }

  let elapsedOut = minutes(record.outTime);
  if (elapsedOut <= inMinutes) {
    elapsedOut += 1440;
  }

  let cutoff = dayEnd;
  if (cutoff <= inMinutes) {
    cutoff += 1440;
  }

  if (elapsedOut > cutoff) {
    ot = (elapsedOut - cutoff) / 60;
  } else {
    ot = 0;
  }

  const regularElapsedMinutes = Math.min(Math.max(0, cutoff - inMinutes), 9 * 60);
  regular = Math.min(s.regularHours, Math.max(0, regularElapsedMinutes / 60 - 1));

  if (elapsedOut < cutoff) {
    early = true;
  }

  if (crossesMidnight(record.inTime, record.outTime)) {
    night = s.nightBill;
  }

  return { regular, ot, late, early, night };
}

/* ========================================================= MONTHLY STATISTICS ========================================================= */
function monthStats() {
  const s = settings();
  const currentMonth = todayLocal().slice(0, 7);
  const records = workerRecords().filter((record) => record.date && record.date.startsWith(currentMonth));

  let present = 0, absent = 0, leave = 0, holiday = 0, regular = 0, ot = 0, late = 0, night = 0;
  let early = false;

  records.forEach((record) => {
    const calculation = calculate(record);
    if (record.status === "present") present++;
    if (record.status === "absent") absent++;
    if (["leave", "sick"].includes(record.status)) leave++;
    if (record.status === "holiday" || record.dutyType === "holiday") holiday++;

    regular += calculation.regular;
    ot += calculation.ot;
    late += calculation.late;
    night += calculation.night;
    if (calculation.early) early = true;
  });

  const hourly = s.salary > 0 && s.salaryDays > 0 && s.regularHours > 0 
    ? (s.salary * 0.5605) / (s.salaryDays * s.regularHours) 
    : 0;
  const otRate = hourly * s.otMultiplier;
  const otPay = ot * otRate;
  const bonus = (late > s.lateLimit || early) ? 0 : s.attendanceBonus;
  const total = s.salary + otPay + bonus + night;

  return { records, rs: records, present, absent, leave, holiday, regular, ot, late, night, hourly, otRate, otPay, bonus, total, early };
}

/* ========================================================= DASHBOARD & RENDERING ========================================================= */
function stat(title, value, className = "", primary = false) {
  return `
    <div class="stat ${primary ? "primary" : ""}">
      <small>${title}</small>
      <strong class="${className}">${value}</strong>
    </div>`;
}

function renderDashboard() {
  const m = monthStats();
  const s = settings();
  const worker = activeWorker();

  if ($("activeWorkerName")) $("activeWorkerName").textContent = worker.name;
  if ($("activeWorkerMeta")) $("activeWorkerMeta").textContent = `${todayLocal().slice(0, 7)} • মাসিক হিসাব`;
  if (!$("dashboard")) return;

  $("dashboard").innerHTML = [
    stat("এই মাসের মোট বেতন", money(m.total), "", true),
    stat("Present", m.present),
    stat("Regular Hours", fmtHours(m.regular)),
    stat("OT Hours", fmtHours(m.ot)),
    stat("OT Rate", money(m.otRate)),
    stat("OT Wage", money(m.otPay)),
    stat("Late", m.late + " min", m.late > s.lateLimit ? "bad" : ""),
    stat("Night Bill", money(m.night)),
    stat("Attendance Bonus", money(m.bonus), m.bonus ? "ok" : "bad")
  ].join("");
}

function renderToday() {
  if (!$("todayCard")) return;
  const record = workerRecords().find((item) => item.date === todayLocal());
  if (!record) {
    $("todayCard").innerHTML = '<div class="empty">আজকের কোনো ডিউটি সেভ করা হয়নি।</div>';
    return;
  }
  const calculation = calculate(record);
  let dutyLabel = "Day Duty";
  if (record.dutyType === "night") dutyLabel = "Night Duty";
  if (record.dutyType === "holiday" || record.status === "holiday") dutyLabel = "Holiday Duty";

  $("todayCard").innerHTML = `
    <div class="today-row">
      <div>
        <strong>${dutyLabel}</strong><br>
        <span class="badge ${record.status}">${record.status}</span>
      </div>
      <div>
        <b>OT ${fmtHours(calculation.ot)} h</b><br>
        <small>${record.inTime || "-"} → ${record.outTime || "-"}</small><br>
        <small>Night Bill: ${money(calculation.night)}</small>
      </div>
    </div>`;
}

function renderRecent() {
  if (!$("recentRecords")) return;
  const records = workerRecords().slice().sort((a, b) => b.date.localeCompare(a.date)).slice(0, 5);
  if (!records.length) {
    $("recentRecords").innerHTML = '<div class="empty">এখনও কোনো রেকর্ড নেই।</div>';
    return;
  }
  $("recentRecords").innerHTML = records.map((record) => {
    const c = calculate(record);
    let duty = record.dutyType === "night" ? "Night" : (record.dutyType === "holiday" || record.status === "holiday" ? "Holiday" : "Day");
    return `
      <div class="record-row" style="padding:10px 0; border-bottom:1px solid #e2e8f0">
        <div>
          <b>${record.date}</b><br>
          <small>${duty} • ${record.status}</small>
        </div>
        <div>
          <b>OT ${fmtHours(c.ot)}h</b><br>
          <small>${money(c.night)}</small>
        </div>
      </div>`;
  }).join("");
}

function renderRecords() {
  if (!$("records") \vert{}\vert{} !$("recordSearch")) return;
  const query = ($("recordSearch").value || "").toLowerCase();
  let records = workerRecords().slice().sort((a, b) => b.date.localeCompare(a.date));

  if (query) {
    records = records.filter((record) =>
      `${record.date} ${record.status} ${record.dutyType} ${record.notes || ""}`.toLowerCase().includes(query)
    );
  }

  if ($("recordCount")) $("recordCount").textContent = `${records.length}টি রেকর্ড`;

  $("records").innerHTML = records.map((record) => {
    const c = calculate(record);
    let duty = record.dutyType === "night" ? "Night" : (record.dutyType === "holiday" || record.status === "holiday" ? "Holiday" : "Day");
    return `
      <tr>
        <td>${record.date}</td>
        <td>${duty}</td>
        <td>${record.status}</td>
        <td>${record.inTime || "-"}</td>
        <td>${record.outTime || "-"}</td>
        <td>${fmtHours(c.regular)}</td>
        <td>${fmtHours(c.ot)}</td>
        <td>${c.late}</td>
        <td>${money(c.night)}</td>
        <td>
          <button class="mini secondary" onclick="editRecord(${record.id})">Edit</button>
          <button class="mini danger" onclick="deleteRecord(${record.id})">Delete</button>
        </td>
      </tr>`;
  }).join("") || `<tr><td colspan="10" class="empty">কোনো রেকর্ড পাওয়া যায়নি।</td></tr>`;
}

function escapeHtml(value) {
  return String(value).replace(/[&<>'"]/g, (char) => {
    const map = { "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", '"': "&quot;" };
    return map[char];
  });
}

function renderWorkers() {
  if (!$("workerList")) return;
  $("workerList").innerHTML = data.workers.map((worker) => `
    <div class="worker-item">
      <div>
        <b>${escapeHtml(worker.name)}</b>
        <div class="meta">${worker.id === data.activeWorkerId ? "✓ Active Worker" : ""}</div>
      </div>
      <div class="worker-actions">
        <button onclick="selectWorker(${worker.id})">${worker.id === data.activeWorkerId ? "Active" : "Select"}</button>
        ${data.workers.length > 1 ? `<button class="danger" onclick="deleteWorker(${worker.id})">Delete</button>` : ""}
      </div>
    </div>`).join("");
}

function renderAll() {
  loadSettings();
  renderDashboard();
  renderToday();
  renderRecent();
  renderRecords();
  renderWorkers();
}

function showPage(id) {
  document.querySelectorAll(".page").forEach((page) => page.classList.toggle("active", page.id === id));
  document.querySelectorAll(".nav-item").forEach((btn) => btn.classList.toggle("active", btn.dataset.page === id));
  window.scrollTo(0, 0);
}

function toast(message) {
  if (!$("toast")) return;
  const element = $("toast");
  element.textContent = message;
  element.classList.add("show");
  clearTimeout(window._toast);
  window._toast = setTimeout(() => element.classList.remove("show"), 2200);
}

function setDefaults() {
  if ($("date")) $("date").value = todayLocal();
  if ($("inTime")) $("inTime").value = "08:00";
  if ($("outTime")) $("outTime").value = "17:00";
  if ($("dutyType")) $("dutyType").value = "day";
  if ($("status")) $("status").value = "present";
  if ($("editingRecordId")) $("editingRecordId").value = ""; // Edit ID Reset
}

/* ========================================================= EVENTS & ACTIONS ========================================================= */
if ($("dutyType")) {
  $("dutyType").addEventListener("change", () => {
    const type = $("dutyType").value;
    if (type === "day" || type === "holiday") {
      if ($("inTime")) $("inTime").value = "08:00";
      if ($("outTime")) $("outTime").value = "17:00";
    } else if (type === "night") {
      if ($("inTime")) $("inTime").value = "20:00";
      if ($("outTime")) $("outTime").value = "04:00";
    }
  });
}

if ($("dutyForm")) {
  $("dutyForm").addEventListener("submit", (e) => {
    e.preventDefault();
    const dutyType = $("dutyType").value;
    const editingId = $("editingRecordId") ? $("editingRecordId").value : null;

    const record = {
      id: editingId ? Number(editingId) : Date.now(),
      date: $("date").value,
      dutyType,
      status: dutyType === "holiday" ? "holiday" : $("status").value,
      inTime: $("inTime").value,
      outTime: $("outTime").value,
      notes: $("notes") ? $("notes").value : ""
    };

    const records = workerRecords();
    const existingIndex = records.findIndex((item) => item.id === record.id || item.date === record.date);

    if (existingIndex >= 0) {
      records[existingIndex] = record;
    } else {
      records.push(record);
    }

    records.sort((a, b) => a.date.localeCompare(b.date));
    save();
    setDefaults();
    if ($("notes")) $("notes").value = "";
    toast("ডিউটি সেভ হয়েছে");
    showPage("homePage");
  });
}

if ($("clearBtn")) {
  $("clearBtn").onclick = () => {
    if ($("dutyForm")) $("dutyForm").reset();
    setDefaults();
  };
}

if ($("recordSearch")) {
  $("recordSearch").addEventListener("input", renderRecords);
}

["salary", "salaryDays", "regularHours", "otMultiplier", "attendanceBonus", "lateLimit", "nightBill"].forEach((id) => {
  if ($(id)) {$(id).addEventListener("change", persistSettings); // input-এর বদলে change ইভেন্ট ব্যবহারে পারফর্মেন্স ভালো থাকবে
  }
});

if ($("addWorkerBtn")) {
  $("addWorkerBtn").onclick = () => {
    const name = ($("workerName")?.value || "").trim();
    if (!name) {
      toast("Worker-এর নাম দিন");
      return;
    }
    const id = Date.now();
    data.workers.push({ id, name, settings: {} });
    data.records[id] = [];
    data.activeWorkerId = id;
    if ($("workerName")) $("workerName").value = "";
    save();
    toast("Worker যোগ হয়েছে");
  };
}

window.selectWorker = (id) => {
  data.activeWorkerId = id;
  save();
  toast("Active Worker পরিবর্তন হয়েছে");
  showPage("homePage");
};

window.deleteWorker = (id) => {
  if (data.workers.length <= 1) {
    toast("কমপক্ষে একজন Worker থাকতে হবে");
    return;
  }
  if (!confirm("এই Worker এবং তার সব record মুছবেন?")) return;
  data.workers = data.workers.filter((worker) => worker.id !== id);
  delete data.records[id];
  data.activeWorkerId = data.workers[0].id;
  save();
};

/* FIX: Edit করার সময় ডাটা না মুছে ফর্মে সেট করা */
window.editRecord = (id) => {
  const record = workerRecords().find((item) => item.id === id);
  if (!record) return;

  $("date").value = record.date;
  $("dutyType").value = record.dutyType;
  $("status").value = record.status;
  $("inTime").value = record.inTime || "";
  $("outTime").value = record.outTime || "";
  if ($("notes")) $("notes").value = record.notes || "";

  // Hidden Input Field-এ আইডি রাখা (যাতে HTML-এ <input type="hidden" id="editingRecordId"> থাকে)
  if (!$("editingRecordId")) {
    const input = document.createElement("input");
    input.type = "hidden";
    input.id = "editingRecordId";
    $("dutyForm").appendChild(input);
  }
  $("editingRecordId").value = record.id;

  showPage("dutyPage");
  window.scrollTo(0, 0);
};

window.deleteRecord = (id) => {
  if (!confirm("এই record মুছবেন?")) return;
  data.records[activeWorker().id] = workerRecords().filter((record) => record.id !== id);
  save();
  toast("Record মুছে ফেলা হয়েছে");
};

if ($("clearAllBtn")) {
  $("clearAllBtn").onclick = () => {
    if (!confirm("এই Worker-এর সব record মুছবেন?")) return;
    data.records[activeWorker().id] = [];
    save();
    toast("সব record মুছে গেছে");
  };
}

function downloadNative(content, fileName, mime) {
  const bytes = new TextEncoder().encode(content);
  let binary = "";
  bytes.forEach((byte) => (binary += String.fromCharCode(byte)));
  const base64 = btoa(binary);

  if (window.AndroidApp && AndroidApp.saveFile) {
    AndroidApp.saveFile(base64, fileName, mime);
    return;
  }

  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.href = url;
  link.download = fileName;
  document.body.appendChild(link);
  link.click();
  link.remove();
  URL.revokeObjectURL(url);
}

if ($("exportBtn")) {
  $("exportBtn").onclick = () => {
    const rows = [["Date", "Duty Type", "Status", "In", "Out", "Regular Hours", "OT Hours", "Late Minutes", "Night Bill", "Notes"]];
    workerRecords().forEach((record) => {
      const c = calculate(record);
      rows.push([record.date, record.dutyType, record.status, record.inTime, record.outTime, c.regular, c.ot, c.late, c.night, record.notes || ""]);
    });

    const csv = "\ufeff" + rows.map((row) => row.map((val) => `"${String(val).replaceAll('"', '""')}"`).join(",")).join("\n");
    downloadNative(csv, "amar-overtime-records.csv", "text/csv;charset=utf-8");
    toast("CSV export করা হয়েছে");
  };
}

if ($("backupBtn")) {
  $("backupBtn").onclick = () => {
    downloadNative(JSON.stringify(data, null, 2), "amar-overtime-backup.json", "application/json");
  };
}

if ($("restoreBtn")) {
  $("restoreBtn").onclick = () => {
    if (window.AndroidApp && AndroidApp.openBackup) {
      AndroidApp.openBackup();
    } else {
      toast("Android app থেকেই Restore করুন");
    }
  };
}

window.importBackup = (json) => {
  try {
    const incoming = JSON.parse(json);
    if (!incoming.workers || !incoming.records) throw new Error("Invalid backup");
    data = incoming;
    localStorage.setItem(KEY, JSON.stringify(data));
    renderAll();
    toast("Backup সফলভাবে Restore হয়েছে");
  } catch (error) {
    toast("Backup ফাইলটি সঠিক নয়");
  }
};

if ($("quickWorkerBtn")) {
  $("quickWorkerBtn").onclick = () => showPage("settingsPage");
}

document.querySelectorAll("[data-page]").forEach((button) => {
  button.addEventListener("click", () => showPage(button.dataset.page));
});

function tick() {
  if (!$("clock")) return;
  $("clock").textContent = new Date().toLo
